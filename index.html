<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f3ee">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>私密预览</title>
<style>
:root{font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:#283b34;background:#f4f3ee}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px}
main{max-width:430px;width:100%}svg{width:36px;height:38px;fill:none;stroke:#4f7262;stroke-width:1.2;margin-bottom:22px}
h1{font-size:25px;line-height:1.4;font-weight:500;letter-spacing:-.025em;margin:0 0 14px}
p{font-size:14px;line-height:1.85;color:#5e6c60;margin:0}
button{font:inherit;font-size:13px;min-height:44px;margin-top:24px;padding:11px 18px;border:0;border-radius:7px;background:#283b34;color:#fffdf2;cursor:pointer}
button:hover{background:#3c563b}button:focus-visible{outline:2px solid #4f7262;outline-offset:4px}
::selection{background:#c5d8bf;color:#263a2e}[hidden]{display:none}
</style>
</head>
<body>
<main aria-labelledby="title">
<svg viewBox="0 0 36 38" aria-hidden="true"><path d="m4 12 14-8 14 8v16l-14 8-14-8Zm0 0 14 8 14-8M18 20v16M11 8l14 8v16"/></svg>
<h1 id="title">正在打开预览</h1>
<p id="status" role="status" aria-live="polite">正在读取分享链接…</p>
<button id="retry" hidden>重新加载</button>
</main>
<script>
'use strict';
(() => {
 const title=document.querySelector('#title'),status=document.querySelector('#status'),retry=document.querySelector('#retry');
 const fail=(heading,message,canRetry=false)=>{title.textContent=heading;status.textContent=message;retry.hidden=!canRetry};
 retry.addEventListener('click',()=>location.reload());
 window.addEventListener('hashchange',()=>location.reload());
 const encoded=new URLSearchParams(location.hash.slice(1)).get('k');
 if(!encoded||!/^[A-Za-z0-9_-]{43}$/.test(encoded)){
  fail('需要完整分享链接','请使用分享者提供的完整链接，确认没有遗漏 # 后面的内容。');return;
 }
 if(!window.isSecureContext||!globalThis.crypto?.subtle){
  fail('浏览器暂不支持','请通过 HTTPS 链接，在较新的 Chrome、Edge 或 Safari 中打开。');return;
 }
 (async()=>{
  let keyBytes;
  try{keyBytes=Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0))}
  catch{fail('链接不完整','请重新获取分享者提供的完整链接。');return}
  if(keyBytes.length!==32){fail('链接不完整','请重新获取分享者提供的完整链接。');return}
  status.textContent='正在加载加密内容…';
  let packed;
  try{
   const response=await fetch(new URL('preview.bin',location.href),{credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});
   if(!response.ok)throw new Error('unavailable');
   packed=new Uint8Array(await response.arrayBuffer());
  }catch{fail('加载失败','请检查网络后重试，或向分享者确认链接仍然有效。',true);return}
  if(packed.length<33||String.fromCharCode(...packed.slice(0,4))!=='LPV1'){
   fail('内容暂不可用','请向分享者重新获取链接。');return;
  }
  status.textContent='正在打开加密预览…';
  try{
   const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);
   const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:packed.slice(4,16),additionalData:packed.slice(0,4),tagLength:128},key,packed.slice(16));
   const html=new TextDecoder('utf-8',{fatal:true}).decode(plain);
   keyBytes.fill(0);
   document.open();document.write(html);document.close();
  }catch{keyBytes.fill(0);fail('无法打开此预览','链接中的密钥不匹配，或内容已更新。请重新获取完整分享链接。')}
 })();
})();
</script>
</body>
</html>
